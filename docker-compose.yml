services:
  backend:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/db:/app/instance
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-random-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-}

  frontend:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
